<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dice Poker</title>
  <meta name="description" content="Dice Poker: a classic five-dice game. Roll five dice, hold the keepers and chase the best hand.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1f6b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Dice Poker">
  <link rel="stylesheet" href="style.css?v=1.6.0">
</head>
<body>
  <div id="update-banner" class="update-banner" role="alert" hidden>
    <span id="update-text" data-i18n="update.available">A new version is available. Your game in progress is kept.</span>
    <button id="update-now" type="button" class="primary small" data-i18n="update.now">Update</button>
    <button id="update-later" type="button" class="link" data-i18n="update.later">Later</button>
  </div>
  <main>
    <header>
      <button id="quests-btn" type="button" class="icon-btn quests-btn" aria-label="Quests">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4"/>
        </svg>
        <span id="quest-count" class="badge">0/0</span>
      </button>
      <button id="sound" type="button" class="icon-btn" aria-pressed="true" aria-label="Sound on">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/>
          <path class="on" d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/>
          <path class="off" d="m16 9 6 6m0-6-6 6"/>
        </svg>
      </button>
      <h1>Dice Poker</h1>
      <p id="sub" class="sub"></p>
    </header>

    <div class="layout">
    <div class="board">
    <section class="table" aria-label="Dice" data-i18n-aria-label="dice.label">
      <div id="dice" class="dice"></div>
      <div class="controls">
        <button id="roll" type="button" class="primary"></button>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
      <p class="tip" data-i18n="tip">Tap a die to hold it. Then tap a category to score.</p>
    </section>

    <section class="card" aria-label="Scorecard" data-i18n-aria-label="scorecard.label">
      <table id="scorecard"></table>
    </section>
    </div>

    <aside class="side card" aria-label="Leaderboard" data-i18n-aria-label="leaderboard.title">
      <h2 data-i18n="leaderboard.title">Leaderboard</h2>
      <p id="rank" class="rank" aria-live="polite"></p>
      <div class="board-wrap">
        <div id="gauge" class="gauge" role="meter" aria-label="Current score" data-i18n-aria-label="gauge.label" aria-valuemin="0">
          <div class="tube"><div class="fill"></div></div>
          <div class="bulb"></div>
          <div id="marks" class="marks"></div>
        </div>
        <ol id="leaderboard" class="leaderboard"></ol>
      </div>
    </aside>
    </div>

    <footer class="app-footer">
      <button id="install" type="button" class="primary small" data-i18n="install" hidden>Install app</button>
      <p id="ios-hint" class="hint" data-i18n="install.ios" hidden>To install: tap Share, then “Add to Home Screen”.</p>
      <p class="meta">
        Dice Poker <span id="version"></span>
        <button id="check-update" type="button" class="link" data-i18n="update.check" hidden>Check for updates</button>
        <span id="update-status" aria-live="polite"></span>
      </p>
    </footer>

    <dialog id="quests-dlg" class="quests-dlg" aria-labelledby="quests-title">
      <div class="dlg-head">
        <h2 id="quests-title" data-i18n="quests.title">Quests</h2>
        <button id="quests-close" type="button" class="link" data-i18n="close">Close</button>
      </div>
      <p id="quests-summary" class="q-summary"></p>
      <div id="quests-list"></div>
    </dialog>

    <div id="quest-toast" class="quest-toast" popover="manual" role="status">
      <span id="toast-icon" class="q-icon" aria-hidden="true"></span>
      <span><small data-i18n="toast.done">Quest complete</small><strong id="toast-name"></strong></span>
    </div>

    <div id="quest-card" class="quest-card" popover="manual" role="alert">
      <div class="card-inner">
        <div class="card-face card-front">
          <small data-i18n="card.found">Hidden quest found!</small>
          <span id="card-icon" class="card-icon" aria-hidden="true"></span>
          <strong id="card-name"></strong>
        </div>
        <div class="card-face card-back">
          <strong id="card-back-name"></strong>
          <p id="card-text"></p>
          <small data-i18n="card.continue">Tap to continue</small>
        </div>
      </div>
    </div>

    <dialog id="end">
      <h2 data-i18n="end.title">Game over</h2>
      <p id="final"></p>
      <form method="dialog"><button id="again" class="primary" value="again" data-i18n="end.again">Play again</button></form>
    </dialog>
  </main>
  <script src="version.js?v=1.6.0"></script>
  <script src="locales/en.js?v=1.6.0"></script>
  <script src="locales/de.js?v=1.6.0"></script>
  <script src="locales/fr.js?v=1.6.0"></script>
  <script src="locales/es.js?v=1.6.0"></script>
  <script src="locales/id.js?v=1.6.0"></script>
  <script src="i18n.js?v=1.6.0"></script>
  <script src="scoring.js?v=1.6.0"></script>
  <script src="sound.js?v=1.6.0"></script>
  <script src="quests.js?v=1.6.0"></script>
  <script src="questui.js?v=1.6.0"></script>
  <script src="game.js?v=1.6.0"></script>
  <script src="pwa.js?v=1.6.0"></script>
</body>
</html>
